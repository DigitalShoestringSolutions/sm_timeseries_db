build: "placeholder"
environment:
  - DOCKER_INFLUXDB_ORG=${DB_ORG}
  - DOCKER_INFLUXDB_BUCKET=${DB_BUCKET}
  - DOCKER_CURRENT_INFLUXDB_TOKEN=${DB_ADMIN_INITIAL_TOKEN}
  - INFLUXD_STORAGE_CACHE_MAX_MEMORY_SIZE=256m
  - INFLUXD_QUERY_MEMORY_BYTES=200000000
  - GOMEMLIMIT=512MiB
  - GOGC=10
deploy:
  resources:
    limits:
      memory: 700M  # Absolute ceiling